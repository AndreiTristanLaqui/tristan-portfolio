<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tristan is a software engineer building reliable systems and distinctive digital products." />
    <meta name="theme-color" content="#F5F1E8" />
    <title>Tristan — Software Engineer</title>
  </head>
  <body>
    <script>
      (() => {
        const saved = localStorage.getItem("portfolio-theme");
        const theme = saved === "light" || saved === "dark" ? saved : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
